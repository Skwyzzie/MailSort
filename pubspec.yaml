name: mail_sort
description: "A custom application for scanning USPS/UPS tracking numbers to keep accountability of packages for KFAB."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  hive: ^2.2.3
  isar_flutter_libs: ^4.0.0-dev.13
  path_provider: ^2.1.0
  hive_flutter: ^1.1.0
  flutter_barcode_listener: ^0.1.4
  data_table_2: ^2.3.12
  google_mlkit_text_recognition: ^0.17.1
  pdfx: ^2.11.0
  pdf: ^3.11.0
  file_picker: ^12.0.0
  platform_ocr:
    git:
      url: https://github.com/Skwyzzie/platform_ocr.git
      ref: main
  intl: ^0.20.3
  image: ^4.1.7
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4 # Use the latest version
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
      - assets/slip_template.png
      - assets/check.png

scripts:
  bump:
    build: cider bump patch --bump-build
    patch: cider bump patch
    minor: cider bump minor
    major: cider bump major
  build:
    bundle: flutter build appbundle
    windows: flutter build windows
    apk: flutter build apk
    ios: flutter build ios
    # For rps, you chain nested commands by removing the word "rps" and just writing the path
    all: bump build && build apk && build ios