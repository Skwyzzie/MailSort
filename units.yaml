# BE EXTREMELY CAREFUL WHEN EDITING THIS FILE. YAML IS VERY SENSITIVE TO SPACES AND INDENTATION.
# This file should only be edited by someone who is familiar with YAML and the structure of this file.
# But in case you don't have access, here's a crash course:
#   1. Lines that start with a # are comments and are ignored by the program.
#   2. Make sure to ONLY use spaces for indentation, not tabs. The indentation is important for the YAML file to be valid.
#   3. The version shouldn't change. This is the version the program expects to read. If I push an update that changes the version, I will update this comment to reflect that.
#   4. branches are the top-level keys. Each branch (Army, Air Force, Navy, Marines) has a list of units. Each unit has a name, abbreviation, and mail clerk.
#      The mail clerk is the person who is responsible for receiving and distributing mail for that unit. If you don't know the mail clerk, leave it blank.
#   5. The unitName is the full name of the unit. The unitAbbreviation is the abbreviation of the unit. The unitMailClerk is the name of the mail clerk for that unit.
#   6. EVERY BRANCH MUST HAVE A GENERAL DELIVERY UNIT. DO NOT REMOVE THESE.
# If you have questions and cannot find the answer in this comment, please reach out to me either on Signal (612-618-0313) or email me at  DATA_MASKEDfor help

version: 1
branches:
# If you need to add/change units, use the following syntax. Make sure to put the unit in the correct branch (Army, Air Force, Navy, Marines).

#   - unitName: "" 
#     unitAbbreviation: ""
#     unitMailClerk: "" # All caps, LAST, FIRST
  Army:
    - unitName: "ARMY GENERAL DELIVERY" 
      unitAbbreviation: "AR GD"
      unitMailClerk: "YIN, SHAWN"
  Air Force:
    - unitName: "AIR FORCE GENERAL DELIVERY" 
      unitAbbreviation: "AF GD"
      unitMailClerk: "RUTH CARO, SAMANTHA"
  Navy:
    - unitName: "NAVY GENERAL DELIVERY" 
      unitAbbreviation: "NV GD"
      unitMailClerk: "UNASSIGNED"
  Marines:
    - unitName: "MARINES GENERAL DELIVERY" 
      unitAbbreviation: "M GD"
      unitMailClerk: "UNASSIGNED"

